name: Snapshot Build

on:
  workflow_dispatch:

env:
  CCACHE_DIR: /home/debian/.cache/dwproton/ccache
  CCACHE_MAXSIZE: 25G

jobs:
  build-x86_64:
    name: Build x86_64
    runs-on: trixie
    steps:
      - name: Prepare ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          if [ ! -w "$CCACHE_DIR" ]; then
            echo "::error::$CCACHE_DIR is not writable by $(id -un)"
            exit 1
          fi
          echo "ccache dir: $CCACHE_DIR ($(du -sh "$CCACHE_DIR" | cut -f1))"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Init submodules
        run: |
          git submodule update --init --filter=tree:0 --recursive
          mkdir ./build

      - name: Get version
        id: vars
        run: |
          tag=$(grep -m1 'CURRENT_PREFIX_VERSION=' proton | cut -d'"' -f2)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure
        working-directory: ./build
        env:
          RUSTFLAGS: -Copt-level=3 -Ctarget-cpu=nocona
          USE_LTO: 0
        run: |
          ../configure.sh \
            --build-name=dwproton-${{ steps.vars.outputs.tag }}-${{ steps.vars.outputs.sha_short }}-x86_64 \
            --enable-ccache \
            --without-tts --without-extras=all --without-vklayers=all --without-nvidia-libs

      - name: Build
        working-directory: ./build
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          make -j$(nproc) redist

      - name: ccache stats
        if: always()
        run: |
          du -sh "$CCACHE_DIR" || true

      - name: Upload snapshot artifact
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: dwproton-${{ steps.vars.outputs.tag }}-${{ steps.vars.outputs.sha_short }}-x86_64
          path: |
            ./build/dwproton-${{ steps.vars.outputs.tag }}-${{ steps.vars.outputs.sha_short }}-x86_64.tar.xz
            ./build/dwproton-${{ steps.vars.outputs.tag }}-${{ steps.vars.outputs.sha_short }}-x86_64.sha512sum
          retention-days: 14
