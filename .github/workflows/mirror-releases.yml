name: Mirror upstream releases

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-releases
  cancel-in-progress: false

jobs:
  mirror:
    # Only ever run from the mirror's own branch, never from mirrored branches.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      UPSTREAM: https://dawn.wine/api/v1/repos/dawn-winery/dwproton
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Replicate releases
        run: |
          set -euo pipefail

          curl -fsSL "$UPSTREAM/releases?limit=50" > upstream.json
          curl -fsSL "$UPSTREAM/tags?limit=100" > tags.json

          mapfile -t existing < <(gh release list --limit 300 --json tagName --jq '.[].tagName')

          jq -r '.[] | select(.draft == false) | .tag_name' upstream.json | while read -r tag; do
            if printf '%s\n' "${existing[@]:-}" | grep -qxF "$tag"; then
              continue
            fi

            jq -r --arg t "$tag" '.[] | select(.tag_name == $t) | .body' upstream.json > notes.md
            name=$(jq -r --arg t "$tag" '.[] | select(.tag_name == $t) | .name' upstream.json)
            pre=$(jq -r  --arg t "$tag" '.[] | select(.tag_name == $t) | .prerelease' upstream.json)
            sha=$(jq -r  --arg t "$tag" '.[] | select(.name == $t) | .commit.sha' tags.json)

            args=(--title "$name" --notes-file notes.md)
            if [ -n "$sha" ] && [ "$sha" != "null" ]; then
              args+=(--target "$sha")
            fi
            if [ "$pre" = "true" ]; then
              args+=(--prerelease)
            fi

            echo "Creating release $tag"
            # Created through GITHUB_TOKEN, so it does not trigger the mirrored
            # branches' own workflows.
            gh release create "$tag" "${args[@]}" || echo "Skipped $tag, target commit not mirrored yet"
          done
