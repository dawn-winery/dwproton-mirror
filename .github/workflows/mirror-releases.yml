name: Mirror upstream releases

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-releases
  cancel-in-progress: false

jobs:
  mirror:
    # Only ever run from the mirror's own branch, never from mirrored branches.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      UPSTREAM: https://dawn.wine/api/v1/repos/dawn-winery/dwproton
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Replicate releases
        run: |
          set -euo pipefail

          curl -fsSL "$UPSTREAM/releases?limit=50" > upstream.json
          curl -fsSL "$UPSTREAM/tags?limit=100" > tags.json

          mapfile -t existing < <(gh release list --limit 300 --json tagName --jq '.[].tagName')

          jq -c '.[] | select(.draft == false)' upstream.json | while read -r rel; do
            tag=$(jq -r '.tag_name' <<<"$rel")
            name=$(jq -r '.name' <<<"$rel")
            pre=$(jq -r '.prerelease' <<<"$rel")
            sha=$(jq -r --arg t "$tag" '.[] | select(.name == $t) | .commit.sha' tags.json)

            if printf '%s\n' "${existing[@]:-}" | grep -qxF "$tag"; then
              echo "Release $tag already exists, checking assets"
            else
              jq -r '.body' <<<"$rel" > notes.md
              args=(--title "$name" --notes-file notes.md)
              if [ -n "$sha" ] && [ "$sha" != "null" ]; then
                args+=(--target "$sha")
              fi
              if [ "$pre" = "true" ]; then
                args+=(--prerelease)
              fi
              echo "Creating release $tag"
              # Created through GITHUB_TOKEN, so it does not trigger the mirrored
              # branches' own workflows.
              gh release create "$tag" "${args[@]}" || { echo "Skipped $tag, target commit not mirrored yet"; continue; }
            fi

            have=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)
            jq -r '.assets[] | .name + "\t" + .browser_download_url' <<<"$rel" | while IFS=$'\t' read -r aname aurl; do
              if printf '%s\n' "$have" | grep -qxF "$aname"; then
                continue
              fi
              echo "Uploading $aname to $tag"
              curl -fsSL "$aurl" -o "$aname"
              gh release upload "$tag" "$aname" --clobber
              rm -f "$aname"
            done
          done
